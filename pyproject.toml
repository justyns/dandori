[project]
name = "dandori"
version = "0.1.0"
description = "Local-first work ledger for AI agents: markdown items + append-only JSONL journal in a git repo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
dori = "dandori.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
